<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EBD - Escola Bíblica de Discípulos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--g:#16a34a;--g2:#22c55e;--gd:#166534;--gl:#dcfce7;--bg:#f0fdf4;--bd:#bbf7d0;--tx:#14532d;--mut:#4d7c5f;--y:#facc15;--r:#ef4444}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Baloo 2",system-ui,sans-serif;font-size:16px;padding-bottom:92px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:#fff;border-bottom:3px solid var(--bd);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;z-index:5;gap:6px}
.lv{width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;font-weight:800;display:grid;place-items:center;border:3px solid var(--gl);flex:none}
.bar{height:11px;background:var(--gl);border-radius:9px;overflow:hidden;margin-top:2px;width:80px}.bar i{display:block;height:100%;background:var(--g2);border-radius:9px;transition:width .5s}
.pill{background:var(--gl);border-radius:20px;padding:3px 10px;font-weight:800;font-size:14px;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border:3px solid var(--bd);border-radius:22px;padding:14px;margin-bottom:14px}.unit-card{padding:16px 14px 18px;background:linear-gradient(180deg,#fff 0%,#f8fff9 100%)}.unit-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.unit-mark{font-size:28px}
.hero{background:var(--g);color:#fff;border-color:var(--gd);display:flex;gap:10px;align-items:center}
h1,h2,h3{margin:0 0 4px;line-height:1.15}h1{font-size:24px}h3{font-size:19px}p{margin:3px 0}.mut{color:var(--mut);font-size:14px}
button{font:inherit;font-weight:700;cursor:pointer;border:3px solid var(--bd);background:#fff;color:var(--tx);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--bd);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:none}
button.p{background:var(--g);color:#fff;border-color:var(--gd);box-shadow:0 4px 0 var(--gd);width:100%;font-size:18px}
button:disabled{opacity:.45;cursor:not-allowed}
.path{display:flex;flex-direction:column;align-items:center;gap:13px;margin:16px auto 4px;max-width:260px;position:relative}.path:before{content:'';position:absolute;top:25px;bottom:25px;left:50%;width:8px;border-radius:10px;background:repeating-linear-gradient(to bottom,var(--bd) 0 12px,#fff 12px 20px);transform:translateX(-50%);z-index:0}.path .dot{z-index:1}.path .dot:nth-child(4n+1){transform:translateX(-42px)}.path .dot:nth-child(4n+2){transform:translateX(0)}.path .dot:nth-child(4n+3){transform:translateX(42px)}.path .dot:nth-child(4n){transform:translateX(0)}
.dot{width:70px;height:70px;border-radius:50%;font-size:29px;padding:0;position:relative;border-width:4px;box-shadow:0 6px 0 var(--bd)}
.dot.done{background:var(--g2);border-color:var(--gd);box-shadow:0 6px 0 var(--gd)}.dot.cur{border-color:var(--g);background:#fff;box-shadow:0 6px 0 var(--g);animation:pulse 1.2s infinite}
.dot small{position:absolute;bottom:-4px;right:-2px;background:var(--y);color:#713f12;border-radius:10px;font-size:11px;padding:0 5px}
.verse{background:var(--gl);border-left:6px solid var(--g);border-radius:14px;padding:10px 12px;font-style:italic;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin-top:10px;font-size:17px}
.opt.ok{background:var(--g2);color:#fff;border-color:var(--gd);animation:pop .4s}.opt.no{background:#fee2e2;border-color:var(--r);animation:shake .3s}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(250,253,255,.94);backdrop-filter:blur(18px) saturate(1.45);border-top:1px solid rgba(116,170,210,.28);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -10px 30px rgba(35,75,130,.10)}
nav button{flex:1;min-width:0;border:0;box-shadow:none;background:transparent;font-size:10px;font-weight:850;letter-spacing:.2px;padding:5px 0;color:#607086;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .24s ease,color .24s ease,transform .24s ease;position:relative}
nav button b{width:38px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#16a8db;background:linear-gradient(145deg,rgba(28,190,255,.12),rgba(40,115,255,.06));border:1px solid rgba(28,190,255,.15);transition:all .24s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
nav button b svg{width:23px;height:23px;display:block;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 1px 2px currentColor)}
nav button:nth-child(1) b{color:#12b981;background:linear-gradient(145deg,rgba(16,220,151,.16),rgba(16,185,129,.06));border-color:rgba(16,185,129,.22)}
nav button:nth-child(2) b{color:#8b5cf6;background:linear-gradient(145deg,rgba(167,139,250,.18),rgba(124,58,237,.06));border-color:rgba(139,92,246,.22)}
nav button:nth-child(3) b{color:#ec4899;background:linear-gradient(145deg,rgba(244,114,182,.18),rgba(219,39,119,.06));border-color:rgba(236,72,153,.22)}
nav button:nth-child(4) b{color:#f59e0b;background:linear-gradient(145deg,rgba(251,191,36,.2),rgba(245,158,11,.06));border-color:rgba(245,158,11,.24)}
nav button:nth-child(5) b{color:#3b82f6;background:linear-gradient(145deg,rgba(96,165,250,.2),rgba(37,99,235,.06));border-color:rgba(59,130,246,.22)}
nav button:nth-child(6) b{color:#eab308;background:linear-gradient(145deg,rgba(250,204,21,.22),rgba(217,119,6,.07));border-color:rgba(234,179,8,.25)}
nav button.on{color:#087c59;background:linear-gradient(135deg,rgba(209,250,229,.88),rgba(219,234,254,.78));border-radius:15px;box-shadow:inset 0 0 0 1px rgba(16,185,129,.10)}
nav button.on b{color:#fff;border-color:transparent;background:linear-gradient(145deg,#19c98a,#087eaa);box-shadow:0 4px 13px rgba(8,145,178,.28),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-2px)}
nav button:active{transform:scale(.94)}nav button:not(.on):hover b{transform:translateY(-2px) scale(1.06);filter:saturate(1.3)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.nf{flex:none!important}
.scene{border-radius:22px;background:linear-gradient(#bbf7d0,#fff);min-height:170px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:58px;margin-bottom:10px;border:3px solid var(--bd);flex-wrap:wrap;padding:10px}
.scene span{animation:float 2.8s cubic-bezier(.4,0,.2,1) infinite;transform-origin:center}.scene span:nth-child(2){animation-delay:.4s}.scene span:nth-child(3){animation-delay:.8s}.scene span:nth-child(4){animation-delay:1.2s}
.chip{display:inline-block;margin:4px;padding:9px 14px;border-radius:16px;background:var(--g);color:#fff;font-weight:800;border:0}
.ans{min-height:56px;border:3px dashed var(--g2);border-radius:16px;padding:6px;margin:8px 0;background:var(--gl)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.mem button{aspect-ratio:1;font-size:30px;padding:0;background:var(--g2);border-color:var(--gd);box-shadow:0 3px 0 var(--gd);color:#fff}.mem .up{background:#fff;box-shadow:none}.mem .mt{background:var(--gl);border-color:var(--g2);animation:pop .4s}
.av{border-radius:22px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:10px;border:3px solid var(--bd)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--gd);color:#fff;border-radius:16px;padding:12px;text-align:center;z-index:40;font-weight:700;animation:pop .3s}
.modal{position:fixed;inset:0;background:rgba(20,83,45,.7);display:grid;place-items:center;padding:16px;z-index:35}.modal>div{background:#fff;border:4px solid var(--g);border-radius:28px;padding:22px;text-align:center;max-width:340px;width:100%;animation:pop .5s}
.full{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 30px}.full>div{max-width:600px;margin:0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb{height:12px;background:var(--gl);border-radius:8px;overflow:hidden;margin:6px 0}.tb i{display:block;height:100%;background:var(--g2);width:100%}
.med{opacity:.35;filter:grayscale(1);text-align:center;margin:0}.med.got{opacity:1;filter:none;border-color:var(--y)}
.wsg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.wsg button{padding:0;aspect-ratio:1;font-size:17px;border-radius:10px;box-shadow:none}.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.stg button{aspect-ratio:1;font-size:44px;padding:0}.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.kb button{padding:8px 0;font-size:15px}.jesus-mascot{overflow:visible;filter:drop-shadow(0 5px 3px #14532d22);animation:jesus-bob 3.2s ease-in-out infinite;flex:none}
.jesus-glow{transform-origin:center;animation:halo-pulse 3s ease-in-out infinite}
.hero .jesus-mascot{width:108px;height:108px}
.card,.unit-card,.dot,button,.scene,.av{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.card:hover{transform:translateY(-2px)}
.dot:hover{transform:translateY(-3px) scale(1.04)}
button:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--bd)}
.opt.ok,.mem .mt{animation:success-pop .48s cubic-bezier(.2,1.4,.4,1)}
.modal>div{animation:modal-enter .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
@keyframes jesus-bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes halo-pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.85;transform:scale(1.04)}}
@keyframes success-pop{0%{transform:scale(.86)}65%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes modal-enter{0%{opacity:0;transform:translateY(18px) scale(.88)}100%{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes pulse{50%{scale:1.08}}@media(min-width:700px){main{max-width:760px}.path{max-width:340px}.path .dot:nth-child(4n+1){transform:translateX(-58px)}.path .dot:nth-child(4n+3){transform:translateX(58px)}}

/* Banner principal inspirado na referência enviada */
.hero-shell{position:relative;display:flex;align-items:center;min-height:112px;margin:0 0 16px;padding:9px 9px 9px 7px;border-radius:23px;background:linear-gradient(135deg,#f3fff1,#e5f6e7);box-shadow:0 5px 0 #c5d4c7;overflow:visible}
.hero-banner{position:relative;display:flex;align-items:center;width:100%;min-height:96px;padding:10px 34px 10px 96px;border:3px solid #a3e635;border-radius:22px;background:radial-gradient(ellipse at 12% 50%,#4ade80 0,#15803d 35%,#08752f 100%);color:#fff;box-shadow:inset 0 2px 7px #dcfce788,0 4px 8px #14532d44;overflow:visible}
.hero-banner:before{content:"";position:absolute;inset:4px;border:1px solid #bbf7d077;border-radius:16px;pointer-events:none}
.hero-banner .jesus-mascot{position:absolute;z-index:2;width:150px;height:142px;left:-8px;bottom:-12px;object-fit:contain;object-position:center bottom;background:transparent;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 4px 4px #052e1688);animation:jesus-bob 3.2s ease-in-out infinite;pointer-events:none}
.hero-copy{position:relative;z-index:3;min-width:0;width:100%;padding-left:0;text-shadow:0 1px 2px #064e3b88}
.hero-copy h1{font-size:19px;line-height:1.05;margin:0 0 3px;white-space:nowrap;letter-spacing:-.3px}
.hero-copy h1 em{color:#fde047;font-style:italic}
.hero-copy p{font-size:12px;line-height:1.12;margin:0}
.hero-stats{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;font-weight:800}
.hero-stats span{background:#14532d99;border:1px solid #bbf7d055;border-radius:20px;padding:2px 8px;white-space:nowrap}
.hero-close,.hero-share{position:absolute;z-index:5;border:0;box-shadow:0 3px 7px #052e1644;display:grid;place-items:center;color:white}
.hero-close{right:3px;top:2px;width:25px;height:25px;padding:0;border-radius:50%;background:#16a34a;border:2px solid #bbf7d0;font-size:17px;line-height:1}
.hero-share{right:2px;bottom:-8px;width:36px;height:36px;padding:0;border-radius:50%;background:#14532d;font-size:19px}
.hero-share:hover{transform:translateY(-2px) scale(1.04)}
@media(max-width:390px){.hero-copy h1{font-size:17px}.hero-copy p{font-size:11px}.hero-banner{padding-left:88px;padding-right:27px}.hero-banner .jesus-mascot{width:130px;height:132px}}


/* EXPANSÃO ESCOLA DE DISCÍPULOS — identidade verde + visual lúdico tecnológico */
:root{--g:#0fba78;--g2:#34d399;--gd:#08734d;--gl:#d1fae5;--bg:#f2fbff;--bd:#a7f3d0;--tx:#123b36;--mut:#557b78;--y:#fbbf24}
body{background:radial-gradient(ellipse at 8% 0%,#dbeafe 0,transparent 34%),radial-gradient(ellipse at 100% 12%,#fce7f3 0,transparent 28%),#f3fbf8}
header{background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:2px solid #b7f7dc;box-shadow:0 5px 22px #0f766e12}
.card,.unit-card{border:1px solid #b8ead9;box-shadow:0 8px 22px #0f766e0d, inset 0 1px 0 #fff}
.card.hero{background:linear-gradient(135deg,#059669,#0e7490 72%,#2563eb);border:1px solid #0e7490;box-shadow:0 8px 0 #075985,0 14px 28px #0369a122}
button{border:1px solid #a7e8d0;box-shadow:0 4px 0 #a7e8d0,0 7px 15px #0f766e0c}
button.p{background:linear-gradient(135deg,#10b981,#0d9488);border-color:#08734d;box-shadow:0 4px 0 #08734d,0 8px 18px #05966925}
.dot{background:linear-gradient(145deg,#fff,#ecfdf5);border:3px solid #a7e8d0;box-shadow:0 6px 0 #8edfc1,0 10px 18px #0f766e12}
.dot.cur{background:linear-gradient(145deg,#fff,#d1fae5);box-shadow:0 6px 0 #10b981,0 0 0 7px #10b98118}
.scene{background:radial-gradient(circle at 20% 15%,#fff 0,#dbeafe 36%,#d1fae5 100%);border:1px solid #9bdcc9;box-shadow:inset 0 2px 12px #fff}
.opt{border-radius:17px;background:linear-gradient(145deg,#fff,#f0fdfa)}
.opt.ok{background:linear-gradient(135deg,#10b981,#059669)}
.mem button{background:linear-gradient(145deg,#34d399,#0891b2);border-color:#087e83}
.toast{background:linear-gradient(100deg,#047857,#0e7490);box-shadow:0 10px 30px #064e3b44}
.modal>div{box-shadow:0 22px 70px #052e1644}
.unit-kicker{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:4px 10px;background:#e0f2fe;color:#075985;font-size:12px;font-weight:800}
.lesson-progress{height:8px;background:#dbeafe;border-radius:20px;overflow:hidden;margin:8px 0 14px}
.lesson-progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#38bdf8);border-radius:20px;transition:width .25s}
.story-question{padding:12px;border-radius:18px;background:linear-gradient(135deg,#eff6ff,#ecfdf5);border:1px solid #bae6fd;margin:12px 0}
@media(min-width:700px){.g2{gap:14px}.card{padding:18px}}

</style>
<style>
.topic-stack{display:grid;gap:10px;margin:12px 0}.topic-card{padding:13px 15px;border-radius:17px;background:linear-gradient(135deg,#fff,#f0fdf4);border:1px solid #bbf7d0;box-shadow:0 5px 15px #14532d0d}.topic-card b{color:#166534}.topic-card p{margin:7px 0 0;line-height:1.5;color:#365b43}
.jesus-feedback{display:flex;align-items:center;gap:12px;padding:13px;margin:14px 0;border-radius:20px;box-shadow:0 8px 22px #1232;animation:feedbackIn .35s ease both}.jesus-feedback.joy{background:linear-gradient(120deg,#fef9c3,#dcfce7);border:1px solid #86efac}.jesus-feedback.comfort{background:linear-gradient(120deg,#eff6ff,#fce7f3);border:1px solid #bfdbfe}.jesus-feedback .jesus-mascot{width:82px;height:82px;object-fit:contain;flex:0 0 82px;border-radius:16px}.jesus-feedback b{display:block;font-size:16px;color:#14532d}.jesus-feedback p{margin:5px 0 0;line-height:1.45;color:#365b43}.jesus-feedback.joy:after{content:"✨ 🎉 ✨";position:absolute;right:12px;top:-12px;font-size:20px;animation:popConfetti .7s ease both}.jesus-feedback{position:relative;overflow:visible}@keyframes popConfetti{0%{opacity:0;transform:translateY(12px) scale(.5)}70%{opacity:1;transform:translateY(-8px) scale(1.2)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes feedbackIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
</style><style>
.touch-game{margin-top:12px;background:linear-gradient(135deg,#eff6ff,#fefce8);text-align:center}.touch-items{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.touch-item{width:54px;height:54px;border-radius:16px;background:#fff;border:2px solid #cbd5e1;font-size:26px;box-shadow:0 4px 0 #cbd5e1}.touch-item.selected{background:#dcfce7;border-color:#22c55e;transform:translateY(-3px)}.sticker-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}.sticker{padding:10px 3px;border-radius:14px;background:#f1f5f9;text-align:center;opacity:.72;min-width:0}.sticker.earned{background:linear-gradient(145deg,#fef3c7,#dcfce7);opacity:1;box-shadow:0 4px 12px #14532d18}.sticker div{font-size:28px}.sticker b,.sticker small{display:block;font-size:10px;overflow-wrap:anywhere}.sticker small{color:#64748b;margin-top:3px}
@media(max-width:420px){.sticker-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style><style>
/* ===== ABA EU ===== */
.avsvg{display:block;width:100%;height:auto}
.tw{transform-box:fill-box;transform-origin:center;animation:twk 1.8s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ringin{from{stroke-dasharray:0 400}}
.ring{width:132px;height:132px;flex:none}
.ring .rg{animation:ringin .9s ease-out}

.eu-hero{padding:14px;gap:14px!important;align-items:center}
.eu-hero:hover{transform:none!important}
.eu-bust{width:104px;height:114px;flex:none;border-radius:22px;overflow:hidden;border:3px solid #ffffffcc;background:#fff;box-shadow:0 6px 16px #04301f33}
.eu-bust svg{width:100%;height:100%}
.eu-id{min-width:0;flex:1}
.eu-id h1{font-size:23px;display:flex;align-items:center;gap:6px;margin:0 0 1px;word-break:break-word}
.eu-id p{margin:0;font-size:13px;line-height:1.2}
.eu-id .eu-sm{font-size:12px;opacity:.9;margin-top:3px}
.eu-pen{padding:2px 6px!important;font-size:14px;line-height:1;border:0!important;background:#ffffff33!important;box-shadow:none!important;border-radius:10px!important;flex:none}
.eu-pen:hover{transform:none!important;box-shadow:none!important}
.eu-xp{height:11px!important;background:#ffffff44!important;margin:6px 0 0!important}
.eu-xp i{background:#fde047!important}
.eu-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.eu-chips span{background:#064e3b66;border:1px solid #ffffff44;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.eu-name-edit{display:flex;gap:6px;align-items:center}
.eu-name-edit input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:17px;padding:7px 10px;border-radius:14px;border:2px solid #fff;color:var(--tx);background:#fff}

.eu-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#dff5ea;border-radius:20px;margin-bottom:14px}
.eu-seg button{border:0!important;box-shadow:none!important;border-radius:16px;padding:10px 6px;background:transparent;font-size:16px;color:#3f6b5c}
.eu-seg button:hover{transform:none!important;box-shadow:none!important;background:#ffffff66}
.eu-seg button.on{background:#fff;color:#047857;box-shadow:0 2px 8px #0f766e26!important}

.eu-top{display:flex;gap:14px;align-items:center;margin:6px 0 12px}
.eu-msg b{font-size:18px;line-height:1.15;display:block}
.eu-row{display:flex;gap:10px;align-items:center;margin-top:12px}
.eu-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.eu-bd{flex:1;min-width:0}
.eu-l{display:flex;justify-content:space-between;gap:8px}
.eu-tb{height:12px!important;margin:3px 0!important}
.eu-tb i{transition:width .6s}

.mods{display:grid;gap:9px;margin-top:8px}
.mrow{display:flex;gap:9px;align-items:center}
.me{width:34px;height:34px;border-radius:12px;background:#ecfdf5;display:grid;place-items:center;font-size:19px;flex:none}
.mb{flex:1;min-width:0}
.mt1{display:flex;justify-content:space-between;gap:8px;font-size:14px;line-height:1.1}
.mt1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt1 span{color:var(--mut);font-weight:700;font-size:13px;flex:none}
.tb.sm{height:8px;margin:3px 0 0}
.mk{width:20px;text-align:center;font-size:15px;flex:none}

.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:8px}
.tile{position:relative;aspect-ratio:1;padding:0!important;font-size:24px;border-radius:14px!important;filter:grayscale(1);opacity:.5;background:#f1f5f9;border:1px solid #dbe4ea!important;box-shadow:none!important}
.tile.ok{filter:none;opacity:1;background:#ecfdf5;border:1px solid #86efac!important}
.tile small{position:absolute;right:-2px;bottom:-3px;background:#16a34a;color:#fff;border-radius:9px;font-size:9px;padding:0 4px;line-height:14px}
.tile:hover{transform:translateY(-2px)!important;box-shadow:0 3px 0 #bbf7d0!important}

.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
.qtile{display:flex;gap:9px;align-items:center;padding:10px;border-radius:16px;background:linear-gradient(135deg,#fff,#f0fdf4);border:1px solid #bbf7d0}
.qtile>span{font-size:26px}
.qtile b{font-size:19px;line-height:1}

.dr{display:inline-flex;align-items:center;gap:4px;font-weight:800;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:20px;padding:2px 11px;font-size:15px}
.dr.big{font-size:20px;padding:3px 13px}

.avstage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4}
.avst{display:flex;gap:12px;align-items:center;padding:8px 12px 8px 8px;margin-bottom:10px;box-shadow:0 10px 26px #0f766e26,0 2px 0 #b8ead9}
.avst:hover{transform:none!important}
.avbox{width:118px;flex:none;border-radius:18px;overflow:hidden;border:2px solid #b8ead9;line-height:0}
.avinfo{flex:1;min-width:0}
.eu-itn{display:block;font-size:17px;line-height:1.1;margin:1px 0 4px}

.cats{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:5px;padding:8px 12px!important;border-radius:16px!important;font-size:14px;white-space:nowrap}
.cat.on{background:linear-gradient(135deg,#10b981,#0d9488)!important;color:#fff!important;border-color:#08734d!important;box-shadow:0 3px 0 #08734d!important}
.subs{display:flex;gap:6px;margin-bottom:10px}
.subs button{flex:1;padding:7px 4px!important;font-size:14px;border-radius:14px!important}
.subs button.on{background:#d1fae5;border-color:#10b981!important}

.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ib{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 8px!important;border-radius:16px!important;font-size:12px;line-height:1.1;text-align:center;min-width:0}
.ib b{font-size:12.5px;font-weight:700;min-height:27px;display:flex;align-items:center}
.ib .th{width:100%;height:92px;border-radius:12px;overflow:hidden;line-height:0;background:#eef6f3;display:grid;place-items:center}
.ib .th svg{width:100%;height:100%}
.ib.on{border-color:#10b981!important;background:#ecfdf5}
.ib.try{border-color:#f59e0b!important;background:#fffbeb;box-shadow:0 0 0 3px #fde68a!important}
.pr{font-weight:800;font-size:12px;color:#92400e;background:#fef3c7;border-radius:10px;padding:1px 8px;white-space:nowrap}
.pr.own{color:#047857;background:#d1fae5}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sw{width:44px;height:44px;padding:0!important;border-radius:50%!important;border:3px solid #fff!important;box-shadow:0 0 0 2px #cbd5e1!important}
.sw.on{box-shadow:0 0 0 4px #10b981!important}
.sw:hover{transform:scale(1.08)!important}
@media(max-width:360px){.eu-bust{width:88px;height:98px}.avbox{width:100px}.ring{width:112px;height:112px}.tiles{grid-template-columns:repeat(5,1fr)}}

/* corrige selo de nível esticado no cabeçalho */
header .lv{flex:none!important;width:40px}
header{max-width:100vw}

.dw{display:none}
@media(min-width:560px){.dw{display:inline}}
header>.row.nf:first-child{flex:1 1 0!important;min-width:0}
header>.row.nf:first-child>div:last-child{min-width:0}
header>.row.nf:last-child{gap:5px}
header .pill{padding:3px 8px}

@media(max-width:340px){header .pill{font-size:12px;padding:3px 6px}}

/* EBD: Chamada e logo */
nav button:nth-child(7) b{color:#14b8a6;background:linear-gradient(145deg,rgba(45,212,191,.2),rgba(13,148,136,.06));border-color:rgba(20,184,166,.24)}
nav button:nth-child(1) b{color:#0ea5e9;background:linear-gradient(145deg,rgba(56,189,248,.2),rgba(2,132,199,.06));border-color:rgba(14,165,233,.24)}
.ch-hero{flex-direction:column;text-align:center;padding:18px 14px}.ch-hero h1{font-size:40px;letter-spacing:2px;margin:0}.ch-hero h2{font-size:18px;margin:0 0 4px}
.ebd-logo{width:150px;height:150px;filter:drop-shadow(0 8px 14px #04301f55)}
.ebd-logo .rays{transform-box:fill-box;transform-origin:center;animation:lrot 28s linear infinite}
.ebd-logo .book{animation:lbob 3.4s ease-in-out infinite}
.ebd-logo .sprout{transform-box:fill-box;transform-origin:50% 100%;animation:lsway 3s ease-in-out infinite}
.ebd-logo .cross{transform-box:fill-box;transform-origin:center;animation:lpulse 2.2s ease-in-out infinite}
@keyframes lrot{to{transform:rotate(360deg)}}@keyframes lbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes lsway{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
@keyframes lpulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.15);opacity:1}}
.ch-in{flex:1;min-width:0;font:inherit;font-weight:700;font-size:17px;padding:9px 12px;border-radius:14px;border:2px solid var(--bd);color:var(--tx);background:#fff}
.ch-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:8px;padding:9px 12px}
.ch-row.on{border-color:#10b981;background:#ecfdf5}
.ch-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#34d399,#0e7490);color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center;flex:none}
.ch-b{flex:1;min-width:0}.ch-b b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch-tag{font-size:12px;font-weight:800;border-radius:12px;padding:2px 8px;background:#d1fae5;color:#047857;white-space:nowrap}
.ch-del{flex:none;padding:6px 9px!important;font-size:15px;border-radius:12px!important}

[3,"👨‍👩‍👧","A Primeira Família","Gênesis 2:24 – “Por isso deixará o homem pai e mãe e se unirá à sua mulher.”","Deus inventou a família para ser um lugar de amor, proteção e ensino. O plano original uniu o homem e a mulher para formarem lares fortes.","Quem inventou a família?",["Deus planeou a família desde a criação.","A sociedade inventou a família há pouco.","A família não tem princípios bíblicos."],"A família é uma ideia linda de Deus!"],
[4,"📖","A Palavra Verdadeira","João 17:17 – “A tua palavra é a verdade.”","O mundo diz que a verdade muda com a opinião de cada um. Mas a Palavra de Deus é uma rocha firme que nunca muda.","Onde encontramos um guia seguro para viver?",["Na Bíblia, a Verdade de Deus.","Em vídeos da moda.","Em opiniões que mudam todo o ano."],"A Palavra de Deus é lâmpada para os nossos pés."],
[5,"🙏","Orar em Todo o Tempo","Filipenses 4:6 – “Em tudo, pela oração, apresentai a Deus os vossos pedidos.”","Orar é conversar com o Pai. Podes falar com Ele em qualquer lugar: feliz, com medo ou precisando de ajuda. Ele sempre ouve!","Quando podemos falar com Deus?",["A qualquer hora e em qualquer lugar.","Só dentro da igreja.","Só quando somos perfeitos."],"Deus é um Pai próximo que gosta de ouvir os filhos."],
[6,"🍎","Fruto do Espírito","Gálatas 5:22 – “O fruto do Espírito é amor, alegria, paz, paciência, bondade.”","Uma macieira dá maçãs. Quem anda com Deus dá frutos bons: amor, alegria, paz e paciência. Eles aparecem no que dizemos e fazemos!","Qual destes é fruto do Espírito?",["Amor","Inveja","Orgulho"],"O amor é o primeiro fruto, e os outros crescem com ele."],
[7,"🤝","Amar o Próximo","Mateus 22:39 – “Amarás o teu próximo como a ti mesmo.”","Jesus ensinou a ajudar, compartilhar e perdoar. Quando somos gentis com o colega, estamos mostrando o amor de Deus.","Como Jesus quer que tratemos os outros?",["Com amor e bondade.","Com zombaria.","Ignorando quem precisa."],"Pequenos gestos de bondade mostram o coração de Jesus."],
[8,"🦁","Coragem como Daniel","Daniel 6:22 – “O meu Deus enviou o Seu anjo e fechou a boca dos leões.”","Daniel continuou orando mesmo quando era proibido. Deus viu a sua fidelidade e o protegeu dos leões!","Quem protegeu Daniel dos leões?",["Deus enviou o Seu anjo.","Os guardas do rei.","Ele saiu correndo."],"Quem confia em Deus nunca está sozinho."],
[9,"🧒","Jesus Ama as Crianças","Marcos 10:14 – “Deixai vir a mim os pequeninos.”","Os discípulos queriam afastar as crianças, mas Jesus as abraçou! Você é muito importante para Ele.","O que Jesus disse sobre as crianças?",["Deixai-as vir a mim.","Que esperem lá fora.","Que fiquem longe."],"Jesus ama cada criança com um amor enorme!"],
[10,"🛡️","A Armadura de Deus","Efésios 6:11 – “Revesti-vos de toda a armadura de Deus.”","Um soldado usa capacete e escudo. A nossa armadura é a verdade, a fé e a Palavra de Deus: elas protegem o coração e a mente.","Para que serve a armadura de Deus?",["Para nos fortalecer contra o mal.","Para nos enfeitar.","Não serve para nada."],"Com a armadura de Deus ficamos firmes!"],[11,"🌈","Deus Cumpre Promessas","Gênesis 9:13 – Deus pôs o arco-íris nas nuvens como sinal da Sua promessa.","Depois do dilúvio, Deus prometeu a Noé que nunca mais destruiria a terra com água. Sempre que você vir um arco-íris, lembre-se: Deus cumpre o que promete!","O que o arco-íris nos lembra?",["Que Deus cumpre as Suas promessas.","Que vai chover para sempre.","Que Deus se esqueceu de nós."],"Deus é fiel e nunca quebra uma promessa."],
[12,"👸","A Coragem de Ester","Ester 4:14 – “Quem sabe se para este tempo chegaste ao reino?”","Ester era rainha e o seu povo estava em perigo. Mesmo com medo, ela orou e falou ao rei. Deus usou a sua coragem para salvar muita gente!","O que Ester fez pelo seu povo?",["Teve coragem e falou ao rei.","Escondeu-se no palácio.","Foi embora para longe."],"Quando confiamos em Deus, Ele nos dá coragem."],
[13,"🌾","Rute, a Amiga Fiel","Rute 1:16 – “Aonde quer que fores, irei eu.”","Noemi estava triste e sozinha. Rute decidiu ficar ao lado dela e trabalhou no campo para as duas terem comida. Deus abençoou a sua fidelidade!","Como Rute mostrou amor a Noemi?",["Ficou com ela e a ajudou.","Deixou-a sozinha.","Nem quis saber dela."],"Ser um bom amigo é ficar por perto nas horas difíceis."],
[14,"⛵","Jesus Acalma a Tempestade","Marcos 4:39 – Jesus repreendeu o vento, e fez-se grande bonança.","Os discípulos tiveram muito medo da tempestade, mas Jesus estava no barco! Ele falou e o vento e o mar obedeceram.","Quem acalmou a tempestade?",["Jesus.","Os discípulos.","O próprio barco."],"Jesus tem poder sobre tudo e cuida de nós nos momentos de medo."],
[15,"🍞","Compartilhar como o Menino","João 6:9 – “Está aqui um rapaz que tem cinco pães e dois peixinhos.”","Um menino deu o seu lanche a Jesus, e Jesus o multiplicou para alimentar milhares de pessoas! Quando compartilhamos, Deus faz coisas grandes.","O que Jesus fez com o lanche do menino?",["Multiplicou o lanche para toda a multidão.","Comeu tudo sozinho.","Devolveu o lanche ao menino."],"Até um pequeno presente é grande nas mãos de Jesus."],
[16,"🐑","O Bom Pastor","João 10:11 – “Eu sou o bom pastor.”","Um bom pastor conhece cada ovelha pelo nome e a protege dos perigos. Jesus é o nosso Bom Pastor: conhece você, guia você e dá a vida por você.","Quem cuida de nós como um pastor cuida das ovelhas?",["Jesus.","Ninguém.","O medo."],"Jesus conhece o seu nome e nunca abandona você."],
[17,"🌳","Zaqueu Muda de Vida","Lucas 19:9 – “Hoje veio a salvação a esta casa.”","Zaqueu era baixinho e subiu numa árvore para ver Jesus. Jesus o chamou pelo nome! Zaqueu ficou tão feliz que decidiu ser honesto e generoso.","O que Zaqueu fez depois de encontrar Jesus?",["Mudou de vida e foi generoso.","Subiu ainda mais alto.","Fugiu de Jesus."],"Quando encontramos Jesus, o nosso coração muda."],
[18,"🕊️","O Espírito Santo","João 14:26 – “O Consolador, o Espírito Santo, vos ensinará todas as coisas.”","Jesus prometeu que nunca ficaríamos sozinhos. O Espírito Santo é o nosso Ajudador: nos ensina, nos consola e nos dá força para fazer o bem.","Quem nos ajuda e ensina por dentro?",["O Espírito Santo.","Um robô.","Ninguém."],"O Espírito de Deus está sempre com você."],[19,"💪","Sansão e a Força de Deus","Juízes 16:28 – “Senhor Deus, lembra-te de mim e fortalece-me.”","Sansão tinha uma força enorme, dada por Deus. Mas quando se esqueceu de obedecer, perdeu-se. No fim, ele orou e Deus o fortaleceu outra vez. A verdadeira força vem de Deus!","De onde vinha a força de Sansão?",["De Deus.","De um cabelo mágico.","De comer muito."],"Sem Deus somos fracos; com Deus, somos fortes!"],
[20,"🔥","Elias e os Corvos","1 Reis 17:6 – Os corvos lhe traziam pão e carne de manhã e à tarde.","Elias confiou em Deus num tempo difícil. Deus cuidou dele junto a um ribeiro, mandando corvos com comida todos os dias!","Quem cuidou de Elias no deserto?",["Deus, usando os corvos.","Um rei rico.","Ninguém."],"Deus tem mil maneiras de cuidar de quem confia nele."],
[21,"🏡","O Filho que Voltou","Lucas 15:20 – O pai o viu de longe, correu e o abraçou.","Um filho foi embora e gastou tudo. Arrependido, voltou para casa. O pai não o repreendeu primeiro: correu e o abraçou! Assim é o amor de Deus por nós.","Como o pai recebeu o filho que voltou?",["Correu e o abraçou.","Fechou a porta.","Fingiu não o ver."],"Deus está sempre de braços abertos para quem volta a Ele."],
[22,"🚑","O Bom Samaritano","Lucas 10:33 – Um samaritano viu o ferido e teve compaixão.","Um homem foi ferido na estrada. Dois passaram ao largo, mas um samaritano parou, cuidou dele e pagou a hospedaria. Jesus disse: Faça você o mesmo!","Quem ajudou o homem ferido?",["O samaritano.","Os que passaram ao largo.","Ninguém."],"O próximo é qualquer pessoa que precisa da nossa ajuda."],
[23,"👂","Samuel Ouve a Voz de Deus","1 Samuel 3:10 – “Fala, Senhor, porque o teu servo ouve.”","O menino Samuel ouviu uma voz de noite e pensou que era o sacerdote. Era Deus! Samuel respondeu com um coração atento e obediente.","O que Samuel respondeu a Deus?",["Fala, Senhor, que eu ouço.","Não quero ouvir.","Vá embora."],"Deus fala a quem tem o coração disposto a ouvir."],
[24,"💡","Sal e Luz","Mateus 5:16 – “Assim brilhe a vossa luz diante dos homens.”","Jesus disse que somos luz. Uma vela não se esconde debaixo da cama! Quando somos bondosos e honestos, as pessoas veem Deus em nós.","O que Jesus quer que façamos com a nossa luz?",["Que brilhe com boas ações.","Que a escondamos.","Que a apaguemos."],"Cada gesto de bondade é uma luzinha acesa."],[25,"⭐","Abraão e as Estrelas","Gênesis 15:5 – “Olha para o céu e conta as estrelas, se podes.”","Abraão não tinha filhos, mas Deus lhe prometeu uma família tão grande como as estrelas. Abraão acreditou, e Deus cumpriu a promessa!","O que Deus prometeu a Abraão?",["Uma família enorme como as estrelas.","Um castelo de ouro.","Nada."],"Acreditar em Deus é confiar mesmo quando ainda não vemos."],
[26,"🤗","José Perdoa os Irmãos","Gênesis 50:20 – “Vós pensastes mal contra mim, mas Deus o tornou em bem.”","Os irmãos de José foram maus com ele, mas Deus transformou tudo em bem. José podia vingar-se, mas escolheu perdoar e abraçá-los.","O que José fez quando viu os irmãos?",["Perdoou os irmãos e os abraçou.","Castigou os irmãos.","Fingiu que não os conhecia para sempre."],"Perdoar liberta o coração e traz a família de volta."],
[27,"🎺","Josué e as Muralhas de Jericó","Josué 6:20 – O povo gritou, e as muralhas caíram.","Deus mandou o povo dar voltas à cidade durante sete dias. Parecia estranho, mas eles obedeceram, e as muralhas caíram!","O que fez as muralhas de Jericó caírem?",["O poder de Deus e a obediência do povo.","Uma máquina gigante.","Um terramoto de brincadeira."],"Quando obedecemos a Deus, Ele faz o impossível."],
[28,"🌊","Pedro Anda sobre as Águas","Mateus 14:29 – “Vem”, disse Jesus. E Pedro andou sobre as águas.","Pedro saiu do barco e andou sobre as ondas! Mas quando olhou para o vento, teve medo e começou a afundar. Jesus agarrou a mão dele na hora.","O que aconteceu quando Pedro teve medo?",["Jesus o segurou pela mão.","Ele foi embora nadando.","Ninguém o ajudou."],"Se olharmos para Jesus, o medo fica pequeno."],
[29,"🌅","Jesus Ressuscitou!","Lucas 24:6 – “Não está aqui, mas ressuscitou.”","Na manhã de Páscoa, as mulheres foram ao túmulo e viram a pedra removida. Os anjos disseram: Jesus está vivo! Esta é a maior alegria do mundo.","O que as mulheres encontraram no túmulo?",["Estava vazio: Jesus ressuscitou!","Um tesouro.","Soldados dormindo."],"Jesus venceu a morte e vive para sempre!"]];

LS.push(...[[30, "🧭", "Deus Guia Abraão", "Gênesis 12:1-4", "Deus chamou Abraão para deixar a sua terra e seguir para um lugar que ainda lhe mostraria. Abraão confiou e obedeceu. Ter fé é caminhar com Deus mesmo sem conhecer todos os passos.", "O que Abraão fez quando Deus o chamou?", ["Confiou e partiu, obedecendo a Deus.", "Ficou porque não queria mudar.", "Pediu que outra pessoa fosse no seu lugar."], "A fé de Abraão nos ensina a confiar na direção de Deus."], [31, "🌿", "Deus Cuida de Agar", "Gênesis 21:14-19", "Agar e Ismael ficaram no deserto e a água acabou. Deus ouviu o menino e mostrou a Agar um poço. Deus vê pessoas que outros podem esquecer.", "Quem ouviu o choro de Ismael?", ["Deus.", "O faraó.", "Os soldados."], "Deus vê, ouve e cuida de quem sofre."], [32, "🪜", "O Sonho de Jacó", "Gênesis 28:10-17", "Jacó sonhou com uma escada que ligava a terra ao céu. Deus reafirmou a promessa feita à sua família. Jacó percebeu que Deus estava com ele mesmo longe de casa.", "O que Jacó aprendeu?", ["Que Deus estava com ele.", "Que precisava construir uma escada de verdade.", "Que Deus só estava em sua casa."], "Deus acompanha os seus filhos em todos os lugares."], [33, "🧥", "José Escolhe a Integridade", "Gênesis 39:7-12", "No Egito, José enfrentou uma tentação e escolheu fazer o que era correto. Mesmo quando ninguém parecia estar vendo, ele decidiu honrar a Deus.", "O que José escolheu fazer?", ["Fugir do que era errado e permanecer fiel.", "Mentir para conseguir vantagens.", "Fazer qualquer coisa para agradar pessoas."], "Integridade é fazer o que é certo mesmo quando é difícil."], [34, "🔥", "A Sarça Ardente", "Êxodo 3:1-12", "Moisés viu uma sarça que ardia sem se consumir. Deus chamou Moisés para uma missão: ajudar a libertar o povo de Israel. Moisés teve dúvidas, mas Deus prometeu estar com ele.", "O que Deus prometeu a Moisés?", ["Estar com ele na missão.", "Que nunca teria dificuldades.", "Que seria rei do Egito."], "Deus fortalece quem chama para cumprir uma missão."], [35, "📜", "Os Dez Mandamentos", "Êxodo 20:1-17", "Deus deu ao povo orientações para viver em relação com Ele e com o próximo. Os mandamentos ensinam fidelidade, respeito, verdade e amor.", "Para que serviam os mandamentos?", ["Para orientar o povo a viver com Deus e com o próximo.", "Para tornar o povo famoso.", "Para substituir o amor."], "A Palavra de Deus orienta nossas escolhas."], [36, "🌿", "Débora, uma Juíza Corajosa", "Juízes 4:4-9", "Débora servia como juíza em Israel e ajudou o povo com sabedoria e coragem. Ela ouviu a direção de Deus e encorajou Baraque a agir.", "Como Débora ajudou Israel?", ["Com sabedoria, coragem e liderança.", "Escondendo-se do povo.", "Abandonando sua responsabilidade."], "Deus pode usar pessoas corajosas para ajudar outras."], [37, "🎵", "Davi Louva a Deus", "Salmo 23:1-6", "Davi conhecia o trabalho de pastor e usou essa imagem para falar do cuidado de Deus. O Salmo 23 lembra que Deus guia, sustenta e acompanha o seu povo.", "No Salmo 23, o Senhor é comparado a quem?", ["Um pastor.", "Um comerciante.", "Um guerreiro inimigo."], "Podemos confiar no cuidado e na direção do Senhor."], [38, "🏛️", "Salomão Pede Sabedoria", "1 Reis 3:5-12", "Quando Deus lhe ofereceu um pedido, Salomão pediu sabedoria para governar bem o povo. Ele reconheceu que precisava de ajuda para tomar boas decisões.", "O que Salomão pediu a Deus?", ["Sabedoria para governar.", "Muitas riquezas apenas.", "Um exército maior."], "Pedir sabedoria nos ajuda a escolher o que é correto."], [39, "🛠️", "Neemias Reconstrói os Muros", "Neemias 2:17-20; 4:6", "Neemias viu os muros de Jerusalém destruídos e organizou o povo para reconstruí-los. Houve oposição, mas eles trabalharam com coragem e cooperação.", "Como o povo conseguiu avançar?", ["Trabalhando unido e confiando em Deus.", "Esperando sem fazer nada.", "Desistindo diante da oposição."], "Grandes tarefas podem ser realizadas com união, oração e perseverança."], [40, "🕊️", "O Anúncio a Maria", "Lucas 1:26-38", "O anjo Gabriel anunciou a Maria que ela seria mãe de Jesus. Maria ouviu a mensagem e respondeu com disposição para servir a Deus.", "Como Maria respondeu?", ["Com humildade e disposição para obedecer.", "Com orgulho e desprezo.", "Fugindo da sua família."], "A disponibilidade de Maria é um exemplo de serviço e confiança."], [41, "🌟", "Os Magos Visitam Jesus", "Mateus 2:1-12", "Sábios do Oriente viram uma estrela e viajaram para encontrar Jesus. Ao chegarem, adoraram o menino e ofereceram presentes.", "O que os magos fizeram ao encontrar Jesus?", ["Adoraram-no e ofereceram presentes.", "Tentaram prendê-lo.", "Levaram-no para o palácio de Herodes."], "Jesus é digno de adoração."], [42, "💧", "Jesus é Batizado", "Mateus 3:13-17", "Jesus foi ao rio Jordão e pediu para ser batizado por João. O texto relata o Espírito de Deus descendo como pomba e a voz do Pai declarando seu agrado pelo Filho.", "Quem batizou Jesus?", ["João Batista.", "Pedro.", "Zaqueu."], "O batismo de Jesus marca o início do seu ministério público."], [43, "🏜️", "Jesus Vence a Tentação", "Mateus 4:1-11", "No deserto, Jesus foi tentado, mas respondeu firmando-se na Palavra de Deus e permaneceu obediente ao Pai. Ele nos ensina a buscar a verdade e não trocar o que é certo por vantagens.", "Como Jesus respondeu às tentações?", ["Com fidelidade à Palavra de Deus.", "Fazendo tudo o que o tentador sugeria.", "Desistindo da sua missão."], "A Palavra de Deus nos ajuda a permanecer firmes."], [44, "❤️", "Jesus Ensina a Servir", "João 13:1-17", "Jesus lavou os pés dos discípulos, realizando uma tarefa humilde. Ele ensinou que grandeza no Reino de Deus tem a ver com amor e serviço, não com querer ser superior.", "O que Jesus ensinou ao lavar os pés?", ["Que devemos servir uns aos outros com humildade.", "Que só os importantes devem ser servidos.", "Que tarefas simples não têm valor."], "Seguir Jesus é aprender a servir."], [45, "✝️", "A Cruz de Jesus", "Lucas 23:33-49", "Jesus foi crucificado e entregou a sua vida. A cruz mostra a gravidade do pecado e o amor de Deus. Os Evangelhos contam que Jesus perdoou e confiou no Pai até o fim.", "O que a cruz revela na fé cristã?", ["O amor de Deus e a entrega de Jesus.", "Que Jesus abandonou sua missão.", "Que a violência é uma solução."], "A cruz está no centro da mensagem cristã."], [46, "🌍", "A Grande Comissão", "Mateus 28:18-20", "Depois de ressuscitar, Jesus enviou os discípulos para fazer discípulos de todas as nações, ensinando-os a guardar os seus mandamentos. A missão continua através da igreja.", "O que Jesus pediu aos discípulos?", ["Fazer discípulos e ensinar seus mandamentos.", "Guardar a mensagem só para eles.", "Construir um palácio."], "Podemos compartilhar o amor de Jesus com palavras e atitudes."]]);

function shade(hex,k){
  if(hex.length===4)hex="#"+[...hex.slice(1)].map(c=>c+c).join("");
  const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const f=c=>Math.round(clampN(k<0?c*(1+k):c+(255-c)*k,0,255));
  return "#"+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* ---------- Estado + migração (devolve dracmas dos itens antigos) ---------- */
function initLook(){
  S.inv=Array.isArray(S.inv)?S.inv.filter(x=>typeof x==="string"):[];
  if(!S.look||typeof S.look!=="object"||Array.isArray(S.look)){
    let refund=0;const old=Array.isArray(S.owned)?S.owned:[];
    old.forEach(n=>{const h=HATS.find(x=>x[0]===n)||OUT.find(x=>x[0]===n);if(h&&h[2]>0)refund+=h[2]});
    S.owned=old.filter(n=>BGS.some(b=>b[0]===n));
    S.look={...AV_DEF};
    const ob=S.av&&S.av.bg;if(ob&&getItem("bg",ob)&&own("bg",ob))S.look.bg=ob;
    if(refund>0){S.stars+=refund;S.refund=refund}
  }
  const L=S.look;
  if(!(Number.isInteger(L.skin)&&AVSKIN[L.skin]))L.skin=AV_DEF.skin;
  if(!(Number.isInteger(L.hc)&&AVHAIRC[L.hc]))L.hc=AV_DEF.hc;
  if(!AVHAIR.some(h=>h[0]===L.hair))L.hair=AV_DEF.hair;
  ["outfit","shoes","head","face","neck","bible","bg"].forEach(s=>{if(!getItem(s,L[s])||!own(s,L[s]))L[s]=AV_DEF[s]});
  S.name=typeof S.name==="string"?S.name.slice(0,24):"";
  save();
}initLook();

/* ---------- Progresso ---------- */
function calcProg(){
  const pc=(d,t)=>t?Math.floor(d/t*100):0;
  const td=LS.filter(l=>S.done.includes(l[0])).length,tt=LS.length;
  const sd=ST.filter(s=>S.g["s"+s._progressId]).length,st=ST.length;
  const gd=GM.filter(g=>doneG(g[0])).length,gt=GM.length;
  const frac=(a,b)=>b?a/b:0;
  const geral=Math.floor((frac(td,tt)+frac(sd,st)+frac(gd,gt))/3*100);
  return {tri:{d:td,t:tt,p:pc(td,tt)},his:{d:sd,t:st,p:pc(sd,st)},jog:{d:gd,t:gt,p:pc(gd,gt)},geral};
}
const geralMsg=p=>p>=100?"Discípulo completo! 🏆":p>=75?"Quase um mestre da fé! 🌟":p>=50?"Já passou da metade! 💪":p>=25?"Crescendo na Palavra 🌿":p>0?"Dando os primeiros passos 👣":"Sua jornada está começando! 🌱";
function ringSVG(p){
  const C=2*Math.PI*50;
  return `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Desenvolvimento geral: ${p}%"><defs><linearGradient id="rgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><circle cx="60" cy="60" r="50" fill="none" stroke="#d1fae5" stroke-width="13"/>${p>0?`<circle class="rg" cx="60" cy="60" r="50" fill="none" stroke="url(#rgG)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)" style="--d:${(C*p/100).toFixed(1)}"/>`:""}<text x="60" y="64" text-anchor="middle" font-size="30" font-weight="800" fill="#065f46" font-family="Baloo 2,system-ui,sans-serif">${p}%</text><text x="60" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#557b78" font-family="Baloo 2,system-ui,sans-serif">GERAL</text></svg>`;
}
function eu_row(ic,lb,o,col,unit){

}

function euHero(){

function euProg(){
  const P=calcProg();
  const mods=MODS.map(m=>{const t=m[2].length,d=m[2].filter(id=>S.done.includes(id)).length,p=t?Math.floor(d/t*100):0;return `<div class="mrow"><span class="me">${m[0]}</span><div class="mb"><div class="mt1"><b>${m[1]}</b><span>${d}/${t}</span></div><div class="tb sm"><i style="width:${p}%"></i></div></div><span class="mk">${t&&d===t?"✅":""}</span></div>`}).join("");
  const stT=ST.map((s,i)=>{const dn=!!S.g["s"+s._progressId];return `<button class="tile ${dn?"ok":""}" data-a="story" data-v="${i}" title="${esc(s[1])}" aria-label="${esc(s[1])}${dn?" (lida)":""}"><span>${s[0]}</span>${dn?"<small>✔</small>":""}</button>`}).join("");
  const gmT=GM.map(g=>{const dn=doneG(g[0]);return `<button class="tile ${dn?"ok":""}" data-a="gm" data-v="${g[0]}" title="${esc(g[2])}" aria-label="${esc(g[2])}${dn?" (concluído)":""}"><span>${g[1]}</span>${dn?"<small>✔</small>":""}</button>`}).join("");
  const medals=medalList(),mg=medals.filter(m=>m[2]).length;
  const stk=Object.keys(S.g).filter(k=>k.startsWith("sticker")).length;

  let wt=0,wo=0;[...Object.keys(ITEMS),"bg"].forEach(sl=>slotItems(sl).forEach(it=>{wt++;if(own(sl,it.id))wo++}));
  const qt=(ic,v,l)=>`<div class="qtile"><span>${ic}</span><div><b>${v}</b><div class="mut" style="font-size:12px">${l}</div></div></div>`;
  return `<section class="card"><h3>📊 Desenvolvimento geral</h3><div class="eu-top">${ringSVG(P.geral)}<div class="eu-msg"><b>${geralMsg(P.geral)}</b><p class="mut">É a média entre trilha, histórias e jogos. Cada um vale um terço!</p></div></div>`+
  eu_row("🛤️","Trilha",P.tri,"#10b981","lições")+eu_row("📚","Histórias",P.his,"#8b5cf6","histórias")+eu_row("🎮","Jogos",P.jog,"#f59e0b","jogos")+`</section>`+
  `<section class="card"><h3>🛤️ Trilha por módulo</h3><p class="mut">Cada módulo tem suas lições. Conclua todas para ganhar o ✅</p><div class="mods">${mods}</div></section>`+
  `<section class="card"><h3>📚 Histórias <span class="mut">· ${P.his.d}/${P.his.t}</span></h3><p class="mut">Coloridas são as que você já leu. Toque para ler!</p><div class="tiles">${stT}</div></section>`+
  `<section class="card"><h3>🎮 Jogos <span class="mut">· ${P.jog.d}/${P.jog.t}</span></h3><p class="mut">Os com ✔ já deram prêmio. Toque para jogar!</p><div class="tiles">${gmT}</div></section>`+
  `<section class="card"><h3>🏆 Conquistas</h3><div class="qgrid">${qt("🏅",`${mg}/${medals.length}`,"medalhas")}${qt("📒",`${stk}/${STICKERS.length}`,"figurinhas")}${qt("👨‍👩‍👧",famN(),"momentos em família")}${qt("⚡",dly,"desafios do dia")}${qt("🎒",`${wo}/${wt}`,"itens do guarda-roupa")}${qt("🔥",`${S.streak||1}`,"dias seguidos")}</div></section>`+
  `<section class="card"><h3>🪙 Como ganhar dracmas</h3><p class="mut">Concluir lições <b>+10</b> · Ler histórias <b>+12</b> · Vencer jogos <b>até +20</b> · Desafio do dia <b>+12</b> · Entrar todo dia <b>até +14</b></p><p class="mut" style="margin-top:8px">💡 A dracma era uma moeda de prata nos tempos da Bíblia (Lucas 15:8-10). Use as suas na aba <b>Personagem</b>!</p><button class="p" style="margin-top:10px" data-a="eusub" data-v="av">Ir para o Personagem 🧒</button></section>`;
}

  const c=U.cat;
  if(c==="roupa"||c==="terno"||c==="vestido")return {slot:"outfit",list:OUTF.filter(x=>x.c===c)};

  return null;
}

    `<h3 style="margin-top:12px">Cor do cabelo</h3><div class="swatches">${AVHAIRC.map((x,i)=>`<button class="sw ${S.look.hc===i?"on":""}" style="background:${x[0]}" data-a="avlook" data-v="hc|${i}" aria-label="${x[1]}" title="${x[1]}"></button>`).join("")}</div><p class="mut" style="margin-top:10px">💚 A aparência é de graça: ficar do seu jeito não custa nada!</p>`;
  }else{

      const ow=own(L.slot,x.id),on=S.look[L.slot]===x.id&&!tr,tryOn=tr&&tr.slot===L.slot&&tr.id===x.id;
      const lab=on||(!tr&&S.look[L.slot]===x.id)?"✔ Em uso":ow?(x.p?"Meu · usar":"Usar"):"🪙 "+x.p;
      return `<button class="ib ${S.look[L.slot]===x.id?"on":""} ${tryOn?"try":""}" data-a="avpick" data-v="${L.slot}|${x.id}"><div class="th">${avSVG({...S.look,[L.slot]:x.id},{vb:VBS[L.slot],plain:L.slot!=="bg"})}</div><b>${x.n}</b><span class="pr ${ow?"own":""}">${lab}</span></button>`}).join("")+`</div>`;
  }
  const ref=S.refund?`<div class="card" style="background:#fffbeb;border-color:#fcd34d"><b>🎁 Presente!</b><p>Devolvemos <b>${S.refund} 🪙</b> dos itens da loja antiga. Agora a loja tem muito mais coisas!</p><button data-a="avrefok" style="width:100%">Entendi</button></div>`:"";
  return ref+`<div class="avstage"><div class="card avst"><div class="avbox">${avSVG(cfg,{label:"Pré-visualização do personagem"})}</div><div class="avinfo">${info}</div></div></div>`+
  `<div class="cats" role="tablist">${CATS.map(c=>`<button class="cat ${U.cat===c[0]?"on":""}" data-a="avcat" data-v="${c[0]}"><span>${c[1]}</span>${c[2]}</button>`).join("")}</div><div class="card" style="margin-top:6px">${body}</div>`;
}

return `<section class="card hero ch-hero">${logoSVG()}<h1>EBD</h1><h2>Escola Bíblica de Discípulos</h2><p>Aprender, crescer e caminhar com Jesus 🌱</p></section>`+
`<section class="card"><h3>✍️ Registrar aluno</h3><p class="mut">Digite o nome e toque em Registrar. Tudo o que o aluno fizer nas disciplinas ficará ligado ao nome dele.</p><div class="row" style="margin-top:8px"><input id="chn" class="ch-in" maxlength="24" placeholder="Nome do aluno" autocomplete="off" aria-label="Nome do aluno"><button class="p nf" data-a="chReg" style="width:auto;font-size:16px;padding:9px 14px">Registrar</button></div></section>`+
`<section class="card"><h3>📋 Chamada de hoje</h3>`+(n?`<p class="mut">${pr} de ${n} ${n>1?"alunos presentes":"aluno presente"} hoje. Toque no seu nome para entrar na sua trilha.</p>`+EBD.alunos.map(a=>{const s=alStat(a),on=a.id===EBD.ativo;return `<div class="row" style="gap:6px"><button class="ch-row ${on?"on":""}" data-a="chSel" data-v="${a.id}"><span class="ch-av">${esc((a.nome||"?").trim().charAt(0).toUpperCase())}</span><span class="ch-b"><b>${esc(a.nome)}</b><span class="mut">Nível ${s.lv} · ${s.xp} XP · ${s.dn}/${LS.length} lições (${s.p}%)</span></span>${on?'<span class="ch-tag">● Ativo</span>':s.pr?'<span class="ch-tag">✔ Presente</span>':""}</button><button class="ch-del nf" data-a="chDel" data-v="${a.id}" aria-label="Remover ${esc(a.nome)}">🗑️</button></div>`}).join("")+(at?`<button class="p" style="margin-top:12px" data-a="tab" data-v="trilha">Ir para a trilha de ${esc(at.nome.split(" ")[0])} ▶</button>`:`<p class="mut" style="margin-top:8px">Escolha um nome para começar.</p>`):`<p class="mut">Nenhum aluno registrado ainda. Registre o primeiro nome acima. 👆</p>`)+`</section>`}
function ebdEntrar(id){ebdSave();const a=EBD.alunos.find(x=>x.id===id);if(!a)return;const tab=S.tab;clearInterval(U.iv);clearInterval(U.iv2);
 EBD.ativo=id;S=newS();Object.assign(S,a.dados||{});S.name=a.nome;normBase();initLook();S.tab=tab;
 S.pres=Array.isArray(S.pres)?S.pres:[];if(!S.pres.includes(tod()))S.pres.push(tod());
 Object.assign(U,{l:null,st:null,game:null,fk:null,Q:null,try:null,nm:false,eu:"prog",toast:null,daily:null});save();streakDay()}
Object.assign(A,{
 chReg:()=>{const nome=(($("#chn")||{}).value||"").trim().replace(/\s+/g," ").slice(0,24);
  if(nome.length<2)return toast("Digite o nome do aluno ✍️");
  if(EBD.alunos.some(a=>a.nome.toLowerCase()===nome.toLowerCase()))return toast("Esse nome já está na chamada. Toque nele na lista 👇");
  ebdSave();const id="a"+Date.now();EBD.alunos.push({id,nome,dados:Object.assign(newS(),{name:nome,pres:[]})});ebdEntrar(id);snd("u");if(!U.daily)toast(`Presença registrada, ${nome.split(" ")[0]}! ✅`);else draw()},
 chSel:id=>{const mudou=id!==EBD.ativo;ebdEntrar(id);snd("s");if(!U.daily)toast(mudou?"Aluno trocado. Presença registrada! ✅":"Presença registrada! ✅");else draw()},
 chDel:id=>{const a=EBD.alunos.find(x=>x.id===id);if(!a||!confirm(`Remover ${a.nome} e todo o progresso dele(a)?`))return;
  EBD.alunos=EBD.alunos.filter(x=>x.id!==id);if(EBD.ativo===id){EBD.ativo=null;S=newS();S.tab="chamada"}localStorage.setItem(EBDK,JSON.stringify(EBD));draw()}});
const _tab2=A.tab;A.tab=v=>{if(!ebdAtual()&&v!=="chamada")return toast("Primeiro registre seu nome na Chamada 📋");_tab2(v)};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="chn")A.chReg()});


function draw(){if(!ebdAtual())S.tab="chamada";const T=[["chamada","roll","Chamada"],["trilha","route","Trilha"],["hist","book","Histórias"],["jogos","game","Jogos"],["fam","family","Família"],["med","medal","Medalhas"],["eu","user","Eu"]];
$("#app").innerHTML=`<header><div class="row nf" style="gap:8px"><div class="lv" data-a="tab" data-v="eu" style="cursor:pointer" title="Abrir meu perfil">${lvl()}</div><div><b style="font-size:12px">${S.name?esc(S.name.split(" ")[0])+" · ":""}${ttl()}</b><div class="bar"><i style="width:${S.xp%100}%"></i></div></div></div><div class="row nf"><span class="pill">⚡${S.xp}</span><span class="pill">🔥${S.streak||1}</span><span class="pill" data-a="tab" data-v="eu" style="cursor:pointer" title="Abrir meu perfil">🪙 ${S.stars}<span class="dw"> Dracmas</span></span></div></header><main>${({chamada,trilha,hist:histor,jogos,fam:famMenu,med:meds,eu:euPage})[S.tab]()}</main><nav>${T.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}"><b>${navIcon(t[1])}</b><span>${t[2]}</span></button>`).join("")}</nav>`+(U.l?lesson():"")+(U.st?storyV():"")+(U.game?gameV():"")+(U.fk?famV():"")+(U.toast?`<div class="toast">${U.toast}</div>`:"")+(U.lvl?`<div class="modal"><div><div style="font-size:64px">🏆</div><h2>Você subiu de nível!</h2><p>Agora você é nível ${U.lvl}! Continue assim!</p><button class="p" style="margin-top:12px" data-a="lvlok">Continuar</button></div></div>`:"")+(U.daily&&!U.lvl?`<div class="modal"><div><div style="font-size:64px">🔥</div><h2>${U.daily.s} ${U.daily.s>1?"dias seguidos":"dia"}!</h2><p>Que bom ver você aqui! Você ganhou <b>+${U.daily.b} 🪙 dracmas</b> de presente.</p><button class="p" style="margin-top:12px" data-a="dok">Bora aprender! 🚀</button></div></div>`:"")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)A[b.dataset.a](b.dataset.v)});
function streakDay(){if(!ebdAtual())return;try{const td=new Date().toLocaleDateString("sv"),yd=new Date(Date.now()-864e5).toLocaleDateString("sv");if(S.last!==td){S.streak=S.last===yd?(S.streak||0)+1:1;const b=Math.min(S.streak,7)*2;S.stars+=b;S.last=td;save();U.daily={s:S.streak,b}}}catch(e){}}streakDay();
try{draw()}catch(err){
 console.error("Falha ao iniciar a Escola de Discípulos:",err);
 const root=$("#app");
 if(root)root.innerHTML=`<main style="max-width:560px;margin:32px auto;padding:18px;text-align:center"><div style="font-size:54px">🌿</div><h2>Vamos recuperar a sua escola!</h2><p>O progresso salvo tinha dados incompatíveis. Atualize a página para tentar novamente. Se o problema continuar, limpa apenas os dados locais deste aplicativo.</p><button onclick="location.reload()" style="padding:12px 20px;border:0;border-radius:14px;background:#16a34a;color:white;font:inherit;font-weight:800">Recarregar aplicativo</button></main>`;
}
</script>
